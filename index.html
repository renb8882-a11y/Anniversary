<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Story</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <div class="login-bg"><div class="login-overlay"></div></div>
  <main class="login-main">
    <div class="login-box">
      <h1>Sign In</h1>
      <div class="form-group">
        <input type="text" id="login-name" placeholder=" " autocomplete="off" />
        <label for="login-name">Your Name</label>
      </div>
      <div class="form-group">
        <input type="password" id="login-password" placeholder=" " autocomplete="off" />
        <label for="login-password">Our Anniversary Date</label>
        <span class="password-hint">Hint: the date we started &#9829;</span>
      </div>
      <p id="login-error" class="login-error" style="display:none">Incorrect password. Try again.</p>
      <a href="profiles.html" id="btn-signin" class="btn-signin">Sign In</a>
    </div>
  </main>
  <div class="login-gradient-bottom"></div>
  <script>
    document.getElementById('btn-signin').addEventListener('click', function(e) {
      var pw = document.getElementById('login-password').value.trim().replace(/[-\/\s]/g,'');
      if (pw !== '821' && pw !== '0821') {
        e.preventDefault();
        document.getElementById('login-error').style.display = 'block';
        document.getElementById('login-password').value = '';
        document.getElementById('login-password').focus();
      }
    });
    document.getElementById('login-password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('btn-signin').click();
    });
  </script>
</body>
</html>
