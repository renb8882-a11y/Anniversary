<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Story</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #E50914;
      --red-hover: #f40612;
      --dark: #141414;
      --dark-input: #333;
      --white: #ffffff;
      --gray: #8c8c8c;
      --light-gray: #b3b3b3;
      --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: var(--white);
      font-family: var(--font);
      overflow-x: hidden;
    }

    /* PAGE SYSTEM */
    .page { min-height: 100vh; position: relative; }
    .page.active { display: block; animation: fadeIn 0.4s ease forwards; }
    .page.hidden { display: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.3); }
      28% { transform: scale(1); }
      42% { transform: scale(1.2); }
      70% { transform: scale(1); }
    }
    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── LOGIN PAGE ── */
    #page-login {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .login-bg {
      position: fixed;
      inset: 0;
      background: url('images/bg.jpg') center/cover no-repeat, #1a0a0a;
      z-index: 0;
    }
    .login-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,#0d0005 0%,#1a0010 20%,#3a0015 40%,#1a0010 60%,#2d0008 80%,#0d0005 100%);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      z-index: -1;
    }
    .login-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
    }
    .login-gradient-bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 200px;
      background: linear-gradient(to bottom, transparent, rgba(20,20,20,.9));
      z-index: 1;
      pointer-events: none;
    }
    .login-header {
      position: relative;
      z-index: 10;
      padding: 20px 48px;
    }
    .login-main {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .login-box {
      background: rgba(0,0,0,0.82);
      border-radius: 6px;
      padding: 60px 68px;
      width: 100%;
      max-width: 450px;
      backdrop-filter: blur(4px);
    }
    .login-box h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 28px;
    }

    .form-group {
      position: relative;
      margin-bottom: 16px;
    }
    .form-group input {
      width: 100%;
      height: 56px;
      padding: 24px 16px 8px;
      background: var(--dark-input);
      border: none;
      border-radius: 4px;
      color: var(--white);
      font-size: 16px;
      font-family: var(--font);
      outline: none;
      transition: background .2s;
    }
    .form-group input:focus { background: #454545; }
    .form-group label {
      position: absolute;
      top: 50%; left: 16px;
      transform: translateY(-50%);
      color: var(--gray);
      font-size: 16px;
      pointer-events: none;
      transition: all .15s ease;
    }
    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label {
      top: 14px;
      transform: none;
      font-size: 11px;
      color: var(--light-gray);
    }
    .password-hint {
      display: block;
      font-size: 12px;
      color: var(--light-gray);
      margin-top: 6px;
      padding-left: 4px;
    }
    .login-error {
      background: rgba(229,9,20,.15);
      border: 1px solid var(--red);
      border-radius: 4px;
      color: #ff6b6b;
      font-size: 14px;
      padding: 10px 14px;
      margin-bottom: 16px;
      text-align: center;
    }
    .login-error.hidden { display: none; }

    .btn-signin {
      width: 100%;
      height: 50px;
      background: var(--red);
      border: none;
      border-radius: 4px;
      color: var(--white);
      font-size: 16px;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      transition: background .2s, transform .1s;
      margin-top: 8px;
      letter-spacing: .3px;
    }
    .btn-signin:hover { background: var(--red-hover); }
    .btn-signin:active { transform: scale(.98); }

    /* ── PROFILES PAGE ── */
    #page-profiles { background: var(--dark); }

    .profiles-header { padding: 20px 48px; }

    .profiles-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .profiles-title {
      font-size: 48px;
      font-weight: 400;
      margin-bottom: 16px;
      text-align: center;
      animation: fadeSlideDown .5s ease forwards;
    }
    .profiles-subtitle {
      font-size: 14px;
      color: var(--gray);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 56px;
      animation: fadeSlideDown .5s ease .1s both;
    }
    .profiles-grid {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1100px;
    }

    .profile-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      opacity: 0;
      animation: cardEntrance .4s ease forwards;
    }
    .profile-card:nth-child(1) { animation-delay: .15s; }
    .profile-card:nth-child(2) { animation-delay: .25s; }
    .profile-card:nth-child(3) { animation-delay: .35s; }
    .profile-card:nth-child(4) { animation-delay: .45s; }
    .profile-card:nth-child(5) { animation-delay: .55s; }

    .profile-avatar {
      width: 180px;
      height: 180px;
      border-radius: 6px;
      overflow: hidden;
      border: 3px solid transparent;
      transition: border-color .15s ease, transform .15s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }
    .profile-card:hover .profile-avatar {
      border-color: var(--white);
      transform: scale(1.08);
    }
    .profile-avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: filter .15s ease;
    }
    .profile-card:hover .profile-avatar img { filter: brightness(1.1); }

    .avatar-placeholder {
      display: none;
      width: 100%; height: 100%;
      background: linear-gradient(145deg,#4a0010 0%,#8b1a2a 45%,#4a0010 100%);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .placeholder-month {
      font-size: 58px;
      font-weight: 900;
      line-height: 1;
    }
    .placeholder-heart {
      font-size: 20px;
      color: var(--red);
      animation: heartbeat 2s ease-in-out infinite;
    }
    .profile-name {
      font-size: 16px;
      color: var(--gray);
      text-align: center;
      font-weight: 500;
      transition: color .15s;
      letter-spacing: .8px;
    }
    .profile-card:hover .profile-name { color: var(--white); }

    .btn-manage {
      margin-top: 56px;
      padding: 10px 24px;
      background: transparent;
      border: 1px solid var(--gray);
      border-radius: 3px;
      color: var(--gray);
      font-size: 13px;
      font-family: var(--font);
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      animation: cardEntrance .4s ease .65s forwards;
      pointer-events: none;
      cursor: default;
    }

    /* ── MEMORY PAGE ── */
    #page-memory { background: var(--dark); }

    .memory-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 20;
      padding: 20px 48px;
      display: flex;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,.8), transparent);
    }
    .btn-back {
      background: none;
      border: none;
      color: var(--white);
      font-size: 16px;
      font-family: var(--font);
      cursor: pointer;
      padding: 8px 0;
      font-weight: 600;
      letter-spacing: .3px;
      transition: opacity .2s;
    }
    .btn-back:hover { opacity: .7; }

    .memory-main { display: flex; flex-direction: column; }

    .memory-hero {
      position: relative;
      width: 100%;
      height: 70vh;
      min-height: 400px;
      overflow: hidden;
      background: linear-gradient(135deg,#3a0a0a 0%,#8b1a1a 100%);
    }
    .memory-hero img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .memory-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right,rgba(20,20,20,.95) 30%,rgba(20,20,20,.4) 80%,transparent);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 60px 64px;
    }
    .memory-badge {
      display: inline-block;
      background: var(--red);
      color: var(--white);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 3px;
      margin-bottom: 14px;
      width: fit-content;
    }
    .memory-title {
      font-size: 56px;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 2px 2px 8px rgba(0,0,0,.5);
      line-height: 1.1;
    }
    .memory-subtitle { font-size: 18px; color: var(--light-gray); }

    .memory-content { padding: 48px 64px; max-width: 800px; }
    .memory-message {
      font-size: 20px;
      line-height: 1.8;
      color: #e5e5e5;
      font-weight: 300;
      white-space: pre-line;
    }
    .memory-nav { display: flex; gap: 16px; padding: 0 64px 64px; }

    .btn-prev-month, .btn-next-month {
      padding: 12px 28px;
      border: 2px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.1);
      border-radius: 4px;
      color: var(--white);
      font-size: 15px;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .15s;
      letter-spacing: .3px;
    }
    .btn-prev-month:hover, .btn-next-month:hover {
      background: rgba(255,255,255,.2);
      border-color: rgba(255,255,255,.6);
      transform: scale(1.02);
    }
    .btn-prev-month:disabled, .btn-next-month:disabled {
      opacity: .3;
      cursor: not-allowed;
      transform: none;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .login-box { padding: 40px 28px; }
      .profiles-title { font-size: 32px; }
      .profile-avatar { width: 130px; height: 130px; }
      .placeholder-month { font-size: 42px; }
      .memory-hero { height: 50vh; }
      .memory-hero-overlay { padding: 30px 24px; }
      .memory-title { font-size: 32px; }
      .memory-content { padding: 32px 24px; }
      .memory-message { font-size: 17px; }
      .memory-nav { padding: 0 24px 48px; flex-wrap: wrap; }
      .memory-header { padding: 16px 24px; }
    }
    @media (max-width: 480px) {
      .profile-avatar { width: 100px; height: 100px; }
      .profiles-grid { gap: 16px; }
    }
  </style>
</head>
<body>

  <!-- LOGIN PAGE -->
  <div id="page-login" class="page active">
    <div class="login-bg"><div class="login-overlay"></div></div>
    <header class="login-header"></header>
    <main class="login-main">
      <div class="login-box">
        <h1>Sign In</h1>
        <form id="login-form" novalidate>
          <div class="form-group">
            <input type="text" id="login-name" placeholder=" " autocomplete="off" />
            <label for="login-name">Your Name</label>
          </div>
          <div class="form-group">
            <input type="password" id="login-password" placeholder=" " autocomplete="off" />
            <label for="login-password">Our Anniversary Date</label>
            <span class="password-hint">Hint: the date we started &#9829;</span>
          </div>
          <div id="login-error" class="login-error hidden">Incorrect password. Try again.</div>
          <button type="button" id="btn-signin" class="btn-signin">Sign In</button>
        </form>
      </div>
    </main>
    <div class="login-gradient-bottom"></div>
  </div>

  <!-- WHO'S WATCHING -->
  <div id="page-profiles" class="page hidden">
    <header class="profiles-header"></header>
    <main class="profiles-main">
      <h1 class="profiles-title">Who's watching?</h1>
      <p class="profiles-subtitle">Choose a chapter of our story</p>
      <div class="profiles-grid" id="profiles-grid">

        <div class="profile-card" data-month="1">
          <div class="profile-avatar">
            <img src="images/month-1.jpg" alt="Month 1" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
            <div class="avatar-placeholder"><span class="placeholder-month">1</span><span class="placeholder-heart">&#9829;</span></div>
          </div>
          <p class="profile-name">Month 1</p>
        </div>

        <div class="profile-card" data-month="2">
          <div class="profile-avatar">
            <img src="images/month-2.jpg" alt="Month 2" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
            <div class="avatar-placeholder"><span class="placeholder-month">2</span><span class="placeholder-heart">&#9829;</span></div>
          </div>
          <p class="profile-name">Month 2</p>
        </div>

        <div class="profile-card" data-month="4">
          <div class="profile-avatar">
            <img src="images/month-4.jpg" alt="Month 4" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
            <div class="avatar-placeholder"><span class="placeholder-month">4</span><span class="placeholder-heart">&#9829;</span></div>
          </div>
          <p class="profile-name">Month 4</p>
        </div>

        <div class="profile-card" data-month="6">
          <div class="profile-avatar">
            <img src="images/month-6.jpg" alt="Month 6" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
            <div class="avatar-placeholder"><span class="placeholder-month">6</span><span class="placeholder-heart">&#9829;</span></div>
          </div>
          <p class="profile-name">Month 6</p>
        </div>

        <div class="profile-card" data-month="12">
          <div class="profile-avatar">
            <img src="images/month-12.jpg" alt="1 Year" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
            <div class="avatar-placeholder"><span class="placeholder-month">12</span><span class="placeholder-heart">&#9829;</span></div>
          </div>
          <p class="profile-name">1 Year &#9829;</p>
        </div>

      </div>
      <button class="btn-manage">Our Journey Since 8/21 &#9829;</button>
    </main>
  </div>

  <!-- MEMORY PAGE -->
  <div id="page-memory" class="page hidden">
    <header class="memory-header">
      <button class="btn-back" id="btn-back">&#8592; Back</button>
    </header>
    <main class="memory-main">
      <div class="memory-hero" id="memory-hero">
        <img id="memory-hero-img" src="" alt="" />
        <div class="memory-hero-overlay">
          <div class="memory-badge" id="memory-badge">Month 1</div>
          <h1 class="memory-title" id="memory-title">Our First Month</h1>
          <p class="memory-subtitle" id="memory-subtitle">August 21, 2025</p>
        </div>
      </div>
      <div class="memory-content">
        <p class="memory-message" id="memory-message"></p>
      </div>
      <div class="memory-nav">
        <button class="btn-prev-month" id="btn-prev-month">&#8592; Previous</button>
        <button class="btn-next-month" id="btn-next-month">Next &#8594;</button>
      </div>
    </main>
  </div>

  <script>
    var MONTHS = [
      {
        month: 1,
        image: 'images/month-1.jpg',
        badge: 'Month 1',
        title: 'Our First Month',
        subtitle: 'August 21, 2025',
        message: 'Every love story has a beginning, and ours started here.\n\nThis was the month everything changed — the butterflies, the late-night texts, the smiles that wouldn\'t quit. I didn\'t know then how special this would become, but I felt it.\n\nThank you for making day one unforgettable. ♥'
      },
      {
        month: 2,
        image: 'images/month-2.jpg',
        badge: 'Month 2',
        title: 'Two Months In',
        subtitle: 'October 21, 2025',
        message: 'Two months felt like a lifetime and a moment all at once.\n\nWe were still figuring each other out — your quirks, my habits, the little things that make you, you. And I loved every discovery.\n\nBy now I knew this was something real. ♥'
      },
      {
        month: 4,
        image: 'images/month-4.jpg',
        badge: 'Month 4',
        title: 'Four Months Together',
        subtitle: 'December 21, 2025',
        message: 'Four months in and you already felt like home.\n\nWe\'d gotten through busy weeks, lazy weekends, and everything in between. The comfort we found in each other — that\'s rare.\n\nI wouldn\'t trade a single moment. ♥'
      },
      {
        month: 6,
        image: 'images/month-6.jpg',
        badge: 'Month 6',
        title: 'Six Months Strong',
        subtitle: 'February 21, 2026',
        message: 'Half a year. Can you believe it?\n\nSix months of laughing at our own inside jokes, of growing side by side, of choosing each other every single day. That\'s what love is — a choice made over and over.\n\nI\'d choose you a thousand times more. ♥'
      },
      {
        month: 12,
        image: 'images/month-12.jpg',
        badge: '1 Year ♥',
        title: 'One Full Year',
        subtitle: 'August 21, 2026',
        message: 'A whole year. 365 days. And somehow it still doesn\'t feel like enough.\n\nThis year you showed me what it means to be loved — really loved. Through everything we\'ve been through, you\'ve been my constant, my favorite person, my home.\n\nHappy anniversary, baby. Here\'s to forever. ♥'
      }
    ];

    var currentMonthIndex = 0;

    function showPage(id) {
      var pages = document.querySelectorAll('.page');
      for (var i = 0; i < pages.length; i++) {
        pages[i].classList.remove('active');
        pages[i].classList.add('hidden');
      }
      var target = document.getElementById(id);
      target.classList.remove('hidden');
      setTimeout(function() { target.classList.add('active'); }, 10);
    }

    // LOGIN
    document.getElementById('btn-signin').addEventListener('click', function() {
      var raw = document.getElementById('login-password').value.trim();
      var normalized = raw.replace(/[-\/\s]/g, '');
      if (normalized === '821' || normalized === '0821') {
        document.getElementById('login-error').classList.add('hidden');
        showPage('page-profiles');
      } else {
        document.getElementById('login-error').classList.remove('hidden');
        document.getElementById('login-password').value = '';
        document.getElementById('login-password').focus();
      }
    });

    // also allow Enter key in password field
    document.getElementById('login-password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('btn-signin').click();
    });

    // PROFILE SELECTION
    document.getElementById('profiles-grid').addEventListener('click', function(e) {
      var card = e.target.closest('.profile-card');
      if (!card) return;
      var month = parseInt(card.getAttribute('data-month'));
      for (var i = 0; i < MONTHS.length; i++) {
        if (MONTHS[i].month === month) { currentMonthIndex = i; break; }
      }
      renderMemory(currentMonthIndex);
      showPage('page-memory');
    });

    // MEMORY PAGE
    function renderMemory(index) {
      var data = MONTHS[index];
      currentMonthIndex = index;
      var img = document.getElementById('memory-hero-img');
      var hero = document.getElementById('memory-hero');
      img.onerror = function() {
        img.style.display = 'none';
        hero.style.background = 'linear-gradient(135deg,#3a0a0a 0%,#8b1a1a 100%)';
      };
      img.onload = function() {
        img.style.display = 'block';
        hero.style.background = '';
      };
      img.src = data.image;
      document.getElementById('memory-badge').textContent = data.badge;
      document.getElementById('memory-title').textContent = data.title;
      document.getElementById('memory-subtitle').textContent = data.subtitle;
      document.getElementById('memory-message').textContent = data.message;
      document.getElementById('btn-prev-month').disabled = index === 0;
      document.getElementById('btn-next-month').disabled = index === MONTHS.length - 1;
      window.scrollTo(0, 0);
    }

    document.getElementById('btn-back').addEventListener('click', function() {
      showPage('page-profiles');
    });
    document.getElementById('btn-prev-month').addEventListener('click', function() {
      if (currentMonthIndex > 0) renderMemory(currentMonthIndex - 1);
    });
    document.getElementById('btn-next-month').addEventListener('click', function() {
      if (currentMonthIndex < MONTHS.length - 1) renderMemory(currentMonthIndex + 1);
    });
  </script>
</body>
</html>
